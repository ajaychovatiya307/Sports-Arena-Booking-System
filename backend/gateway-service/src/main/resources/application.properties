spring.application.name=gateway-service
server.port=8080

spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.user-service[0].uri=http://localhost:8082
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://localhost:8083
spring.cloud.discovery.client.simple.instances.booking-service[0].uri=http://localhost:8084

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**,/api/teams/**

spring.cloud.gateway.routes[2].id=catalog-service
spring.cloud.gateway.routes[2].uri=lb://catalog-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/categories/**,/api/arenas/**,/api/arena-packages/**,/api/slots/**

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://booking-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**,/api/ratings/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
