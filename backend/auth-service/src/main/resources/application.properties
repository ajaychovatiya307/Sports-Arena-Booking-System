spring.application.name=auth-service
server.port=8081

spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=http://localhost:8081
spring.cloud.discovery.client.simple.instances.user-service[0].uri=http://localhost:8082
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://localhost:8083
spring.cloud.discovery.client.simple.instances.booking-service[0].uri=http://localhost:8084

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=60s
resilience4j.timelimiter.configs.default.timeoutDuration=5s
