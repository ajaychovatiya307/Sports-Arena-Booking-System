      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: USER_SERVICE_URL
        sync: false
      - key: CATALOG_SERVICE_URL
        sync: false
