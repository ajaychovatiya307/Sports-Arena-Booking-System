        sync: false
      - key: BOOKING_SERVICE_URL
        sync: false

  - type: web
    name: sports-arena-booking
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/booking-service/Dockerfile
    healthCheckPath: /actuator/health
